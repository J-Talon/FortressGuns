name: FortressGuns
version: '${project.version}'
main: me.camm.productions.fortressguns.FortressGuns
api-version: 1.17
authors: [ CAMM_H87 ]
description: Gun Plugin version 3, with new Artillery and guns.
commands:
  fgticket:
    description: Check chunk ticket
    usage: /ct <uuid>
    permission-message: You do not have permission to use this command
    permission: fg.debug


  fgstatus:
    description: check chunk status in current world (or default)
    usage: /cs <x> <z>
    permission-message: You do not have permission to use this command
    permission: fg.debug


  fginspect:
    description: check an entity you are looking at for plugin construct PDC (within 10 blocks)
    usage: /infocons
    permission: fg.debug
    permission-message: You do not have permission to use this command


  fgitems:
    description: give the player all items from the plugin
    usage: /fgitems
    permission: fg.admin
    permission-message: You do not have permission to use this command


  fgcheckconf:
    description: Read a value from config folder
    usage: /fgcheckconf <section> <value>
    permission: fg.debug
    permission-message: You do not have permission to use this command

default-permission: op